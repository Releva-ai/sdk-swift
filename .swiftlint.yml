# Promotes every warning to an error, so any violation fails the `SwiftLint` CI
# job. Kept here rather than as a `--strict` flag in ci.yml so that `make lint`
# cannot drift into being more lenient than CI. Note that this also promotes the
# explicit `force_cast` / `force_try` severities below — under `strict` there is
# no such thing as an advisory violation.
strict: true

disabled_rules:
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity

opt_in_rules:
  - empty_count
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_string
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

included:
  - Sources
  - Tests

excluded:
  - Carthage
  - .build
  - .spm

force_cast: warning
force_try: warning

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 1