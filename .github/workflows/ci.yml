name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded runs on PR refs. A push to master is the run that
  # gates a release tag, so a quick succession of merges must not cancel it
  # out from under itself and land with no green run recorded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS build and test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must come before any xcodebuild invocation: `xcodebuild -list` on a
      # package directory has to resolve the package graph to enumerate
      # schemes, which clones firebase-ios-sdk (~1 GB) into whatever
      # -clonedSourcePackagesDirPath is in effect. Restoring the cache first,
      # and passing the same path to every xcodebuild call below (including
      # -list), means that clone only ever happens once per Package.swift.
      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          # Package.resolved is gitignored (see .gitignore), so the cache key
          # can only depend on Package.swift. It will occasionally serve a
          # checkout that then re-resolves against a newer compatible
          # version - harmless, still a net win versus refetching Firebase's
          # source on every run.
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Resolve the aggregate scheme name
        id: scheme
        run: |
          set -euo pipefail
          xcodebuild -version
          name=$(xcodebuild -list -json -clonedSourcePackagesDirPath .spm \
            | jq -r '(.workspace // .project).schemes[] | select(endswith("-Package"))' \
            | head -n 1)
          if [ -z "$name" ]; then
            echo "No aggregate -Package scheme found:" >&2
            xcodebuild -list -json -clonedSourcePackagesDirPath .spm >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build all products for iOS
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO

      - name: Select an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '
                .devices
                | to_entries
                | map(select(.key | contains("SimRuntime.iOS-")))
                # Sort numerically on the version components: a lexicographic
                # sort of the runtime key ranks "iOS-18-2" above "iOS-18-10".
                | sort_by(.key | split("SimRuntime.iOS-")[1] | split("-") | map(tonumber))
                | last // {}
                | .value // []
                | map(select(.name | startswith("iPhone")))
                | sort_by(.name)
                | first // {}
                | .udid // empty
              ')
          if [ -z "$udid" ]; then
            echo "No available iOS simulator on this runner image:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests on the iOS simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Report code coverage
        # Runs even when the test step above failed: that's precisely when the
        # per-test failure detail in TestResults.xcresult (uploaded below) is
        # worth having, and the floor check gives a red run a second, more
        # informative reason to be red instead of silently skipping.
        # `!cancelled()`, not `always()` - a cancelled run shouldn't spend
        # runner time in xccov and shouldn't fail the coverage floor check
        # instead of just reporting as cancelled.
        #
        # The floor itself now lives in scripts/coverage.sh as
        # DEFAULT_MIN_LINE_COVERAGE, not here - a copy on each side of this
        # call is exactly what let the two drift apart before.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/coverage.sh TestResults.xcresult

      - name: Zip test result bundle
        # Also runs on failure: a failed run is exactly when the per-test
        # detail inside the bundle (not just the coverage summary above) is
        # worth downloading. `!cancelled()`, not `always()`, for the same
        # reason as the step above. Guarded on existence, same as
        # scripts/coverage.sh, for the build-failed-before-the-bundle-existed
        # case - the upload step's `if-no-files-found: warn` then covers it.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -e TestResults.xcresult ]; then
            # upload-artifact strips the common ancestor directory from
            # whatever `path` points at, so uploading the bundle's contents
            # directly loses the `.xcresult` wrapper - the download won't
            # open in Xcode without manually reconstructing it. Zipping
            # first keeps it a double-clickable bundle on the other end.
            ditto -c -k --sequesterRsrc --keepParent TestResults.xcresult TestResults.xcresult.zip
          fi

      - name: Upload test result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # No ".zip" in the artifact name: upload-artifact zips whatever it is
          # given and serves the download as <name>.zip, so naming the artifact
          # after the file makes the download TestResults.xcresult.zip.zip.
          # "test-results" gives test-results.zip -> the bundle zip -> bundle.
          name: test-results
          path: TestResults.xcresult.zip
          if-no-files-found: warn
          # An -enableCodeCoverage bundle for a build that compiles Firebase
          # from source isn't small, and this now uploads on every PR sync
          # and every push to master. A week is plenty to download one to see
          # why a run went red.
          retention-days: 7
