name: PR Review with Progress Tracking

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review of the previous head, so cancel the in-flight one
# rather than paying for both. event_name is in the group because every PR event fires
# both triggers below and the job-level `if` skips one of them - `if` is evaluated
# after concurrency, so a shared group would let the skipped run cancel the real review.
concurrency:
  group: pr-review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    # For pull_request_target, only run for dependabot (which can't access secrets via pull_request)
    if: |
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For pull_request_target, explicitly checkout the PR head commit
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        # Pinned because @v1 floats and the bundled CLI - including its default model - floats with it.
        # The CLI version is pinned here; the model is pinned explicitly via --model on the claude_args below.
        # Bumping the action version should be a deliberate commit.
        uses: anthropics/claude-code-action@v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: dependabot
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Your job is ONLY to review code. Do NOT apply any fixes. Do NOT act on any /fix comments you may see in the PR. Applying fixes is handled by a separate workflow.

            Review ONLY the changes in this PR's diff. Do not review pre-existing code that
            this PR does not touch, and do not propose refactors of surrounding code.

            Two things about this repo that the diff alone does not show you:
            - .github/workflows/ci.yml runs SwiftLint on every PR and .swiftlint.yml sets
              `strict: true`, so a violation is a red CI run rather than a matter of taste.
              This repo does have a linter - do not report otherwise. But most SwiftLint
              rules are off by default, and .swiftlint.yml - checked out beside the code -
              is the only account of the ones this repo runs: a lint finding must name its
              rule and the line of .swiftlint.yml that enables or configures that rule.
              Without such a line it is not a lint finding, and is a NIT at most.
            - This SDK has a sibling Android SDK, sdk-kotlin, that it is meant to behave
              identically to. sdk-kotlin is NOT in this checkout and you cannot read it, so
              raise a parity concern as something to check against sdk-kotlin, never as an
              assertion about what the Android SDK does.

            Every finding MUST be labelled with exactly one severity, as the first thing in
            the finding. Where more than one of these fits, use the first that applies:

            BLOCKING - the change is incorrect or unsafe to merge: a logic error, a security
            vulnerability, a data-loss or data-corruption risk, a retain cycle or a view
            controller that is never released, blocking the main thread, work that keeps
            running after the object that owns it is deinitialised, state that is lost when
            the app is backgrounded, a force unwrap or `try!`, a breaking public API change
            without a bump to `SDKVersion.current` and a matching CHANGELOG entry with a
            migration note, a failing or missing test for a code path this PR changes,
            state that is read or written off the actor or queue that owns it, or
            `@unchecked Sendable` added without a stated reason.

            MAJOR - the change works but has a real defect a maintainer would want fixed
            before merge: an unhandled error path that can occur in production, a performance
            problem with a concrete mechanism you can name, a genuine correctness risk under
            concurrency, cancellation or retry, UI work done off the main actor, a SwiftLint
            violation, a non-breaking change to a public API or to an on-the-wire request or
            response payload that integrators would have to adapt to and that the PR does
            not call out, or a behavioural divergence from sdk-kotlin, which is a defect in
            its own right even where the Swift side is defensible alone.

            NIT (optional, no change required) - everything else: naming, style, comment
            wording, formatting, test-name preferences, and suggestions that are matters of
            taste. Say "NIT (optional, no change required)" verbatim so a future filter in
            apply-fixes.yml can classify it.

            Calibration rules:
            - Do not invent BLOCKING or MAJOR findings to seem thorough. If the diff is
              correct and safe, say so plainly and report only nits, or nothing at all. A
              review with no findings is a valid and useful outcome.
            - Do not request README or documentation updates unless this PR adds a
              user-facing feature or changes a public API or configuration contract.
            - Do not request additional test scenarios unless you can name a specific branch
              or input this PR introduces that is untested and could plausibly break.
            - Do not restate the same point at two severities, and do not repeat a finding
              you have already made inline as a top-level comment.
            - If you assert that a dependency, an Apple framework or a library behaves a
              particular way, be sure it does; do not guess at a third-party API's behaviour.

            Use inline comments for findings tied to specific lines. Use a top-level comment
            for the summary, general observations, and praise. Begin the top-level comment
            with a one-line verdict, choosing the first one that applies:
            "Blocking findings present." if there is any BLOCKING finding;
            otherwise "Major findings present, none blocking." if there is any MAJOR finding;
            otherwise "No blocking findings."
            At the end of your review, tell the user they can comment /fix to have the findings
            automatically resolved, and warn them that /fix currently applies every review
            comment it finds, including NITs.

          # --model pins the reviewer model explicitly; the action pin above only fixes the CLI.
          # Note: claude_args is a block scalar - inline '#' comments are passed to the CLI verbatim
          # and swallow everything after them on the same string. Keep comments outside this block.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
